# Settings for BruceLee.exe. Remove the # from a line to use it.
# The exe reads config.ini beside itself, then one folder up, then two folders up.
# When a closer file exists, that file is the one that counts.
# Name=Value on the command line overrides the file. A leading / or - is fine.
# PauseOnFocusLoss=False on the command line leaves the game running when
# another program is in front. The program does not store that one.
# The application writes these values when the program closes.
#
# True shows the welcome wizard before the game. The wizard writes False
# when it closes. The choices can be changed later in Settings.
FirstTimeRun = True

# Set to True have infinite falls/lives in game. 
# A score award and a room 16 ying-yang symbol do not add one, and dying does not take one.
InfiniteLives = False

# True leaves the Ninja and Yamo attacking. A blow from either one never
# lands on Bruce. False is the original, and a connecting blow does.
EnemiesCantHitYou = False


# 0 is the opening room. 19 is the last. The game goes there after the title,
# the options page, and the PLAYER page.
StartRoom = 0


# ShowTitleScreen=False skips title screen, options screen and PLAYER screen.
ShowTitleScreen = True


# If FixBugsInOriginal it fixes a known bug in the original game. Keep it
# at False for the authentic experience.
# * Fix Incorrect scoring if landing on enemy kills them
FixBugsInOriginal = True


# Start game in full screen mode. Double click anywhere with mouse to toggle full screen.
# The maximize button turns full screen on.
FullScreen = False


# If ShowCRTFilter=True it adds a screen filter to make it look like you played
# an old TV. The four lines under it are the parts of that filter. They apply
# while ShowCRTFilter is True.
ShowCRTFilter = False

# Curve bows the picture. The corners pull in.
CrtCurve = True

# Scanlines darken the gap between the rows.
CrtScanlines = True

# Blur softens each pixel sideways.
CrtBlur = True

# Vignette darkens the corners of the glass.
CrtVignette = True


# Sound is the original effects and the options tune. False leaves the game silent.
Sound = True
